<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#060709" />
    <meta name="description" content="Serverless Telegram streaming platform for Web & Smart TV" />
    <title>StreamUp — Personal Cinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-obsidian-950 text-white font-sans antialiased overflow-x-hidden selection:bg-amber-500 selection:text-black">
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;background:#08090d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,sans-serif;color:#ffffff;">
        <div style="position:relative;width:96px;height:96px;margin-bottom:20px;border-radius:28px;background:linear-gradient(135deg,#f59e0b,#ef4444,#8b5cf6);padding:3px;box-shadow:0 12px 40px rgba(245,158,11,0.25);">
          <div style="width:100%;height:100%;background:#0c0d14;border-radius:25px;display:flex;align-items:center;justify-content:center;">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" style="margin-left:4px;">
              <polygon points="5 3 19 12 5 21 5 3" fill="url(#playGrad)" />
              <defs>
                <linearGradient id="playGrad" x1="5" y1="3" x2="19" y2="21" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#fbbf24"/>
                  <stop offset="1" stop-color="#f43f5e"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
        <h1 style="font-size:28px;font-weight:700;letter-spacing:-0.5px;margin:0 0 6px 0;background:linear-gradient(to right,#ffffff,#d1d5db);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">StreamUp</h1>
        <p style="font-size:12px;color:rgba(255,255,255,0.5);margin:0 0 24px 0;letter-spacing:1px;text-transform:uppercase;">Personal Cinema</p>
        <div style="width:30px;height:30px;border:3px solid rgba(255,255,255,0.12);border-top-color:#f59e0b;border-radius:50%;animation:streamup-spin 0.9s linear infinite;"></div>
        <style>
          @keyframes streamup-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
